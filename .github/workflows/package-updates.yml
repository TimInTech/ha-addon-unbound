name: Package updates

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build image with current Alpine packages
        run: docker build --pull --no-cache -t unbound-pkg:ci unbound

      - name: Compare package set
        id: pkg
        run: .github/scripts/package-update.sh unbound-pkg:ci

      # Pushes made with GITHUB_TOKEN do not trigger the CI workflow, so the release is verified here.
      - name: Smoke test
        if: steps.pkg.outputs.changed == 'true'
        run: |
          command -v dig >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils; }
          tests/smoke.sh unbound-pkg:ci --hardened

      - name: Home Assistant app linter
        if: steps.pkg.outputs.changed == 'true'
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: "./unbound"

      - name: Commit release
        if: steps.pkg.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unbound/apk-packages.txt unbound/config.yaml unbound/CHANGELOG.md
          git commit -m "Release ${VERSION} with updated Alpine packages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
