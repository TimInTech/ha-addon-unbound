name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Home Assistant app linter
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: "./unbound"
      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 unbound/run.sh tests/smoke.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            smoke: true
          - arch: aarch64
            platform: linux/arm64
            smoke: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./unbound
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: unbound-test:ci
      - name: Smoke test (resolution, DNSSEC, restart, unprivileged start)
        if: matrix.smoke
        run: |
          command -v dig >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils; }
          tests/smoke.sh unbound-test:ci --hardened
