name: Feature request
description: Suggest an improvement to the Unbound app.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This app is intentionally zero-configuration. Requests that add configuration options, a web UI,
        or additional services are unlikely to be accepted — see [CONTRIBUTING.md](../../CONTRIBUTING.md#scope).
        Reliability, security, documentation and CI/build improvements are welcome.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: false
